name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git cliff --config cliff.toml --output CHANGELOG.md

      - name: Commit changelog to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp CHANGELOG.md docs/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main
          git switch main
          git add CHANGELOG.md docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already up to date."
          else
            git commit -m "chore: update changelog for ${TAG}"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file CHANGELOG.md
