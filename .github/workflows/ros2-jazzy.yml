name: ROS 2 Jazzy Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ROS apt source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-ros-apt-source.sh ros2-apt-source

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Use the system Python and ROS environment
        shell: bash
        run: |
          echo "/usr/bin" >> "$GITHUB_PATH"
          source /opt/ros/jazzy/setup.bash
          /usr/bin/python3 -c "import ament_package; import rosidl_adapter"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          echo "AMENT_PREFIX_PATH=$AMENT_PREFIX_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"

      - name: Build with ROS 2 Jazzy
        uses: ros-tooling/action-ros-ci@v0.4
        env:
          FSS_ROS_UNDERLAY: /opt/ros/jazzy
        with:
          target-ros2-distro: jazzy
          skip-tests: "true"
          extra-cmake-args: >-
            -DPython3_EXECUTABLE=/usr/bin/python3
            -DCMAKE_PROJECT_INCLUDE_BEFORE=${{ github.workspace }}/.github/cmake/ros-underlay.cmake
