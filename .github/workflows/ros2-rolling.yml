name: ROS 2 Rolling Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure ROS apt source
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/configure-ros-apt-source.sh ros2-testing-apt-source

      - name: Set up ROS 2 Rolling
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: rolling
          # Rolling binaries for Ubuntu 26.04 are currently in the testing repo.
          use-ros2-testing: "true"

      - name: Use the system Python and ROS environment
        shell: bash
        run: |
          echo "/usr/bin" >> "$GITHUB_PATH"
          source /opt/ros/rolling/setup.bash
          /usr/bin/python3 -c "import ament_package; import rosidl_adapter"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          echo "AMENT_PREFIX_PATH=$AMENT_PREFIX_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"

      - name: Build with ROS 2 Rolling
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: rolling
          skip-tests: "true"
          extra-cmake-args: -DPython3_EXECUTABLE=/usr/bin/python3
