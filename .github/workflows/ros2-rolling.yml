name: ROS 2 Rolling Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rolling_build:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-resolute-ros-rolling-ros-base-latest
    steps:
      - name: Build ROS 2 workspace
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >-
            fss_bringup
            fss_px4_sim
            fss_sensing
            fss_time
            fss_time_interfaces
          target-ros2-distro: rolling
          skip-tests: "true"
